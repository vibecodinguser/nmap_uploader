sonar.projectKey=nmap_uploader
sonar.projectName=nmap_uploader
sonar.sourceEncoding=UTF-8

# Указываем папки с исходным кодом
sonar.sources=components,entrypoints,hooks,lib,types
sonar.exclusions=**/*.test.ts,**/*.test.tsx,node_modules/**,.output/**,.wxt/**,dist/**

# Отключаем устаревшие или несовместимые с современным React правила для UI-компонентов
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# S1185: Nested functions should not be used
# Запрет вложенных функций ломает работу React Hooks (useEffect, useCallback и т.д.), отключаем для TSX
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1185
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx

# S114: Function names should comply with a naming convention
# Требование писать функции в camelCase конфликтует с компонентами React (PascalCase), отключаем для TSX
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S114
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.tsx

# S100: Method/Function names should comply with a naming convention
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.tsx

# S1067: Expressions should not be too complex
# В UI-компонентах часто бывают сложные проверки стейта (isLoaded && !hasError && data), отключаем строгое правило
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1067
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.tsx

# S3776 / S138: Cognitive Complexity / Overly long function
# Смягчаем требования к длине компонентов (допускаем большие render-функции)
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.tsx

# Если SonarQube поддерживает прямую настройку лимитов:
sonar.javascript.maxlines=200
sonar.typescript.maxlines=200
